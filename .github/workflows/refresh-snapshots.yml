name: Generate Daily Snapshot

on:
  schedule:
    # Every 6 hours: 05:30, 11:30, 17:30, 23:30 IST
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run data quality tests
        run: npm test

      - name: Fetch sources and write snapshots
        run: node scripts/generate-daily-snapshot.js

      - name: Commit files
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: snapshot update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git pull --rebase origin main
          git push
