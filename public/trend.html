<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ARGUS: Real-Time Civic Risk Intelligence" />
  <title>Trend Detail • Argus</title>
  <link rel="stylesheet" href="./styles.css?v=20261005a" />
  <style>
    .trend-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    .trend-table th, .trend-table td { padding: 0.4rem 0.5rem; border-bottom: 1px solid rgba(192,192,192,0.25); text-align: left; vertical-align: top; }
    .trend-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .trend-scroll { overflow-x: auto; }
    .day-bars { display: flex; align-items: flex-end; gap: 0.4rem; height: 120px; margin: 0.75rem 0; }
    .day-bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 0.75rem; }
    .day-bar span.bar { width: 100%; background: currentColor; opacity: 0.55; min-height: 2px; }
    .day-bar.missing span.bar { opacity: 0.15; background: repeating-linear-gradient(45deg, currentColor 0 3px, transparent 3px 6px); height: 100%; }
  </style>
</head>
<body>
  <div class="paper-shell">
    <div class="sherlock-field" aria-hidden="true">
      <span class="sherlock-sigil paper s1"></span>
      <span class="sherlock-sigil pen s2"></span>
      <span class="sherlock-sigil glasses s3"></span>
      <span class="sherlock-sigil paper s4"></span>
      <span class="sherlock-sigil pen s5"></span>
      <span class="sherlock-sigil glasses s6"></span>
      <span class="sherlock-sigil paper s7"></span>
      <span class="sherlock-sigil pen s8"></span>
      <span class="sherlock-sigil glasses s9"></span>
      <span class="sherlock-sigil paper s10"></span>
      <span class="sherlock-sigil pen s11"></span>
      <span class="sherlock-sigil glasses s12"></span>
      <span class="sherlock-sigil glasses s13"></span>
      <span class="sherlock-sigil glasses s14"></span>
      <span class="sherlock-sigil glasses s15"></span>
    </div>
    <div class="wildlife-sprites" aria-hidden="true">
      <span class="wildlife owl w3">🦉</span>
      <span class="wildlife bee w4">🐝</span>
      <span class="wildlife bee w5">🐝</span>
      <span class="wildlife owl w6">🦉</span>
      <span class="wildlife bee w8">🐝</span>
      <span class="wildlife bee w9">🐝</span>
      <span class="wildlife owl w10">🦉</span>
      <span class="wildlife bee w11">🐝</span>
      <span class="ambient-book bk1"></span>
      <span class="ambient-book bk2"></span>
      <span class="ambient-book bk3"></span>
      <span class="ambient-book bk4"></span>
      <span class="ambient-book bk5"></span>
      <span class="ambient-book bk6"></span>
    </div>
    <header class="masthead">
      <div class="sherlock-decor" aria-hidden="true">
        <span class="decor-paper p1"></span>
        <span class="decor-paper p2"></span>
        <span class="decor-paper p3"></span>
        <span class="decor-paper p4"></span>
        <span class="decor-pen n1"></span>
        <span class="decor-pen n2"></span>
        <span class="decor-pen n3"></span>
        <span class="decor-pen n4"></span>
        <span class="decor-glasses g1"></span>
        <span class="decor-glasses g2"></span>
        <span class="decor-glasses g3"></span>
        <span class="decor-glasses g4"></span>
        <span class="decor-glasses g5"></span>
      </div>
      <p class="edition">India Digital Risk Monitor • Detail Edition</p>
      <h1>ARGUS</h1>
      <p class="tagline">7-Day Trend Detail</p>
    </header>

    <main class="news-grid">
      <section class="panel">
        <h2 id="detailTitle">Loading trends...</h2>
        <p id="detailMeta" class="trend-stats"></p>
        <p id="detailMethod" class="trend-stats"></p>
      </section>
      <section class="panel">
        <h2 id="detailBodyTitle">7-Day Theme Activity</h2>
        <div id="detailBody"></div>
      </section>
      <section class="panel">
        <p><a href="./">&larr; Back to Front Page Signals</a></p>
      </section>
    </main>

    <footer class="footer-note">
      Trust & Safety-first • Behavioral analysis • Ecosystem-level insights
    </footer>
  </div>

  <script src="./runtime-config.js?v=20261005a"></script>
  <script src="./cursor-effects.js?v=20261005a"></script>
  <script src="./trend.js?v=20261005a"></script>
</body>
</html>
